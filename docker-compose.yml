services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq-status-agent-remote
    restart: always
    ports:
      - "5673:5672"
      - "15673:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - application_network_remote
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:8.0.5
    container_name: mongo-status-agent-remote
    command: ["mongod", "--wiredTigerCacheSizeGB", "1.5"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
    restart: always
    ports:
      - "27018:27017"
    networks:
      - application_network_remote
    deploy:
      resources:
        limits:
          memory: 2g

  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express-status-agent-remote
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USERNAME}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD}
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_BASICAUTH_USERNAME}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_BASICAUTH_PASSWORD}
    ports:
      - "8082:8081"
    restart: always
    networks:
      - application_network_remote
    depends_on:
      - mongo

  producer:
    container_name: producer-status-agent-remote
    build:
      context: .
      dockerfile: ./producer/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    env_file:
      - .env
    restart: always
    networks:
      - application_network_remote

  consumer:
    container_name: consumer-status-agent-remote
    build:
      context: .
      dockerfile: ./consumer/Dockerfile
    restart: always
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_started
    env_file:
      - .env
    networks:
      - application_network_remote

volumes:
  mongo_data:
    external: true
    name: status_agent_mongo_data
  rabbitmq_data:

networks:
  application_network_remote:
    driver: bridge
